name: Build VERTIGO Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'VERTIGO_Android_Project.zip'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Check project archive
        run: |
          if [ ! -f VERTIGO_Android_Project.zip ]; then
            echo "ERROR: VERTIGO_Android_Project.zip not found"
            exit 1
          fi
      - name: Extract Android project
        run: |
          unzip -o VERTIGO_Android_Project.zip -d extracted
      - name: Locate Gradle project
        run: |
          find extracted -name settings.gradle -o -name settings.gradle.kts
          find extracted -name gradlew -o -name build.gradle -o -name build.gradle.kts
          if [ -f extracted/settings.gradle ] || \
             [ -f extracted/settings.gradle.kts ]; then
            echo "PROJECT_DIR=extracted" >> "$GITHUB_ENV"
          else
            SETTINGS_FILE=$(find extracted -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit)
            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: Gradle settings file not found"
              exit 1
            fi
            echo "PROJECT_DIR=$(dirname "$SETTINGS_FILE")" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi
      - name: Find generated APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)
          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/VERTIGO-debug.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VERTIGO-debug-apk
          path: apk-output/VERTIGO-debug.apk
          if-no-files-found: error
          retention-days: 7
